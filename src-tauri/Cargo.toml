[package]
name = "ptrack-desktop"
version = "0.22.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", default-features = false, features = ["config-json"] }

[dependencies]
ptrack-app = { path = "../crates/ptrack-app" }
ptrack-cli = { path = "../crates/ptrack-cli" }
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "x11"] }

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
