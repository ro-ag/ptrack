[package]
name = "ptrack-desktop"
version = "0.28.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ptrack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", default-features = false, features = ["config-json"] }

[dependencies]
ptrack-app = { path = "../crates/ptrack-app" }
ptrack-cli = { path = "../crates/ptrack-cli" }
ptrack-tui = { path = "../crates/ptrack-tui" }
serde_json.workspace = true
tauri = { version = "=2.11.5", default-features = false, features = ["wry", "x11"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
