[package]
name = "ptrack-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true

[dependencies]
ptrack-capability-policy = { path = "../ptrack-capability-policy" }
ptrack-core = { path = "../ptrack-core" }
redb.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "deny"
