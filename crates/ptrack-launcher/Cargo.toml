[package]
name = "ptrack-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Console-free Windows desktop entry point (p-track.exe) that starts `ptrack gui`, shared with the single-file portable"

[[bin]]
name = "p-track"
path = "src/main.rs"

[build-dependencies]
tauri-winres = "=0.3.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "warn"
