<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>P-TRACK Board</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="eyebrow">P-TRACK</p>
            <h1 id="project-name">Project board</h1>
          </div>
        </div>
        <div class="toolbar">
          <label class="plan-picker">
            <span>Plan</span>
            <select id="plan-select" aria-label="Select plan"></select>
          </label>
          <button id="refresh-button" class="button-secondary" type="button">
            Refresh
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="memory-rail" aria-label="Project memory">
          <div class="rail-heading">
            <h2>Project memory</h2>
          </div>

          <section class="memory-section north-star">
            <p class="section-label">North star</p>
            <p id="goal" class="goal">Loading project goal…</p>
          </section>

          <section class="memory-section">
            <p class="section-label">Agent handoff</p>
            <p id="summary" class="summary">No rolling handoff yet.</p>
          </section>

          <section class="memory-section">
            <p class="section-label">Project status</p>
            <div id="project-stats" class="stats-grid"></div>
          </section>

          <section class="memory-section">
            <div class="section-heading">
              <p class="section-label">Open issues</p>
              <span id="issue-total" class="section-count">0</span>
            </div>
            <div id="issue-list" class="issue-list"></div>
          </section>

          <section class="memory-section activity-section">
            <div class="section-heading">
              <p class="section-label">Recent memory</p>
              <span class="section-caption">Notes + commits</span>
            </div>
            <div id="activity-list" class="activity-list"></div>
            <button
              id="activity-more"
              class="activity-more"
              type="button"
              aria-label="Show all recent memory"
              hidden
            >
              Show more…
            </button>
          </section>
        </aside>

        <section class="board-shell">
          <header class="board-heading">
            <div class="plan-context">
              <p class="eyebrow">Current plan</p>
              <div class="title-row">
                <h2 id="plan-title">Loading board…</h2>
                <span id="plan-progress-label" class="progress-label"></span>
              </div>
              <div class="progress-track" aria-hidden="true">
                <span id="plan-progress" class="progress-value"></span>
              </div>
            </div>

            <div class="board-actions">
              <span id="status" class="board-status" aria-live="polite">
                Connecting…
              </span>
              <form id="add-form" class="add-form">
                <input
                  id="task-title"
                  type="text"
                  maxlength="240"
                  autocomplete="off"
                  placeholder="Task title…"
                  aria-label="Task title"
                />
                <button type="submit">Add task</button>
              </form>
            </div>
          </header>

          <section id="board" class="board" aria-label="Kanban board"></section>
        </section>
      </main>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <form
        id="dialog-form"
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-heading"
      >
        <p id="dialog-eyebrow" class="eyebrow">Edit card</p>
        <h2 id="dialog-heading">Rename task</h2>
        <label id="dialog-label" for="dialog-input">Task title</label>
        <input
          id="dialog-input"
          type="text"
          maxlength="240"
          autocomplete="off"
        />
        <textarea
          id="dialog-note"
          maxlength="1000"
          rows="5"
          placeholder="Record a decision, constraint, or useful observation…"
          hidden
        ></textarea>
        <p id="dialog-help" class="dialog-help"></p>
        <div class="dialog-actions">
          <button class="button-secondary" type="button" data-close-modal>
            Cancel
          </button>
          <button id="dialog-submit" type="submit">Save changes</button>
        </div>
      </form>
    </div>

    <div id="memory-modal" class="modal" hidden>
      <div class="modal-backdrop" data-close-memory-modal></div>
      <section
        class="dialog memory-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memory-dialog-heading"
      >
        <div class="memory-dialog-heading">
          <div>
            <p class="eyebrow">Project memory</p>
            <h2 id="memory-dialog-heading">Recent notes and commits</h2>
          </div>
          <button
            id="memory-dialog-close"
            class="dialog-close"
            type="button"
            aria-label="Close recent memory"
          >
            Close
          </button>
        </div>
        <div id="memory-dialog-list" class="memory-dialog-list"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="alert" aria-live="assertive" hidden></div>
    <script src="/app.js" defer></script>
  </body>
</html>
