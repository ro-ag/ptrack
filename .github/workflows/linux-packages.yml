name: Linux packages
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read candidate version
        run: echo "VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" >> "$GITHUB_ENV"
      - name: Build native architecture packages in Ubuntu 22.04
        run: bash build/linux/container-build.sh "$VERSION"
      - name: Install and test on Ubuntu, Debian and Fedora
        run: bash build/linux/test-packages.sh "$VERSION"
      - name: Retain unsigned candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-candidates-${{ runner.arch }}
          path: dist/p-track_*_linux_*
          if-no-files-found: error
          retention-days: 7
