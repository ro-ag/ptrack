name: native acceptance

# This workflow validates a candidate revision without publishing, signing,
# tagging, or using update/release credentials. Candidate packages stay in CI.
on:
  pull_request:
    paths:
      - ".github/workflows/native-acceptance.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "src-tauri/**"
      - "frontend/**"
      - "tools/help_check.py"
      - "tools/help_check_test.py"
      - "tools/linux_packages.py"
      - "tools/linux_appimage.py"
      - ".github/workflows/linux-packages.yml"
      - "tools/release_contract.py"
      - "tools/release_contract_test.py"
      - "build/**"
      - "assets/brand/**"
      - "docs/help/**"
      - "docs/terminal-acceptance.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-acceptance.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "src-tauri/**"
      - "frontend/**"
      - "tools/help_check.py"
      - "tools/help_check_test.py"
      - "tools/linux_packages.py"
      - "tools/linux_appimage.py"
      - ".github/workflows/linux-packages.yml"
      - "tools/release_contract.py"
      - "tools/release_contract_test.py"
      - "build/**"
      - "assets/brand/**"
      - "docs/help/**"
      - "docs/terminal-acceptance.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main-branch run: the release gate trusts its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-packages:
    uses: ./.github/workflows/linux-packages.yml

  portable:
    # The release workflow gates on a green run of this workflow for the tag
    # commit, so release commits must NOT be skipped here.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One cache family per OS, shared with the release workflow.
          shared-key: rust-${{ runner.os }}
          # PRs restore main caches without creating isolated duplicate copies.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Validate portable contracts
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --no-fail-fast
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          python3 -B -m unittest tools.help_check_test tools.release_contract_test
          python3 -B tools/help_check.py all

  native:
    name: native (${{ matrix.archive_os }}/${{ matrix.arch }})
    needs: portable
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            archive_os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            archive_os: linux
            arch: arm64
          - runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            archive_os: windows
            arch: amd64
          - runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            archive_os: windows
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up native Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: "1.89.0"
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One cache family per OS, shared with the release workflow.
          shared-key: rust-${{ runner.os }}
          # PRs restore main caches without creating isolated duplicate copies.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify exact native host
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.rust_target }}"

      - name: Execute native Rust suites
        shell: bash
        run: |
          cargo test --all-targets --no-fail-fast \
            -p ptrack-app \
            -p ptrack-desktop \
            -p ptrack-store \
            -p ptrack-terminal \
            -p ptrack-updater

      # Windows-only: Linux workspace clippy already runs in the portable job,
      # but Windows-only cfg code is never linted without a Windows run.
      - name: Clippy on the native Windows host
        if: runner.os == 'Windows'
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and smoke Linux candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="0.22.0"
          export PTRACK_BUILD_VERSION="$version"
          cargo build --locked --release --package ptrack-desktop --bin ptrack
          binary="target/release/ptrack"
          python3 tools/release_contract.py validate-binary \
            "$binary" "$version" linux "${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/ptrack-home"
          chmod 700 "$RUNNER_TEMP/ptrack-home"
          set +e
          PTRACK_HOME="$RUNNER_TEMP/ptrack-home" \
            timeout 10s xvfb-run --auto-servernum "$binary" gui
          status=$?
          set -e
          test "$status" -eq 124

      - name: Build and smoke Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "0.22.0"
          $env:PTRACK_BUILD_VERSION = $version
          cargo build --locked --release --package ptrack-desktop --bin ptrack
          $binary = "target/release/ptrack.exe"
          python tools/release_contract.py validate-binary `
            $binary $version windows "${{ matrix.arch }}"
          $env:PTRACK_HOME = Join-Path $env:RUNNER_TEMP "ptrack-home-$([guid]::NewGuid())"
          if (Test-Path $env:PTRACK_HOME) {
            throw "native desktop smoke home must start absent"
          }
          $process = $null
          $stdoutPath = Join-Path $env:RUNNER_TEMP "ptrack-gui.stdout"
          $stderrPath = Join-Path $env:RUNNER_TEMP "ptrack-gui.stderr"
          try {
            $process = Start-Process -FilePath $binary -ArgumentList "gui" -PassThru `
              -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              $stdout = @(Get-Content -Tail 20 -ErrorAction SilentlyContinue $stdoutPath) -join "`n"
              $stderr = @(Get-Content -Tail 20 -ErrorAction SilentlyContinue $stderrPath) -join "`n"
              throw "native desktop candidate exited during startup smoke (code=$($process.ExitCode), stdout=$stdout, stderr=$stderr)"
            }
          } finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Package and smoke the per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "0.22.0"
          $env:PTRACK_BUILD_VERSION = $version
          cargo build --locked --release --package ptrack-launcher
          $env:PTRACK_PORTABLE_PAYLOAD = (Resolve-Path target/release/ptrack.exe).Path
          cargo build --locked --release --package ptrack-portable
          $packages = Join-Path $env:RUNNER_TEMP "packages"
          ./build/windows/package.ps1 -Version $version -Arch "${{ matrix.arch }}" `
            -BinDir target/release -OutDir $packages
          $msi = Join-Path $packages "p-track_${version}_windows_${{ matrix.arch }}.msi"
          $log = Join-Path $env:RUNNER_TEMP "msi-install.log"
          $install = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList @('/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"")
          if ($install.ExitCode -ne 0) {
            Get-Content -Tail 40 $log
            throw "per-user install failed with $($install.ExitCode)"
          }
          # The runner is an administrator, so the log's "no elevation
          # required" note never appears; ask Windows Installer how the
          # product was assigned instead (0 = per-user, 1 = per-machine).
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $products = @($installer.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null, $installer,
            @('{3E406A5A-2CA5-4274-AA3C-8B3AEE4F8317}')))
          if ($products.Count -ne 1) {
            throw "expected one installed p-track product, found $($products.Count)"
          }
          $assignment = $installer.GetType().InvokeMember('ProductInfo', 'GetProperty', $null, $installer,
            @($products[0], 'AssignmentType'))
          if ($assignment -ne '0') {
            throw "installer did not install per-user (AssignmentType $assignment)"
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\p-track'
          $reported = & (Join-Path $dir 'ptrack.exe') version
          if ($reported -ne "ptrack $version") {
            throw "installed ptrack reports '$reported'"
          }
          foreach ($name in 'p-track.exe', 'README.md', 'LICENSE') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $name))) {
              throw "installer did not place $name"
            }
          }
          if ((Get-ItemProperty 'HKCU:\Software\ro-ag\p-track').InstallDir -ne "$dir\") {
            throw "installer did not record its install folder"
          }
          if (-not (([Environment]::GetEnvironmentVariable('PATH', 'User') -split ';') -contains "$dir\")) {
            throw "installer did not put its folder on the user PATH"
          }
          $remove = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', "`"$msi`"", '/qn')
          if ($remove.ExitCode -ne 0) {
            throw "uninstall failed with $($remove.ExitCode)"
          }
          if ((Test-Path -LiteralPath $dir) -or (Test-Path 'HKCU:\Software\ro-ag\p-track')) {
            throw "uninstall left the install folder or its registry key behind"
          }

      # The single-file portable must unpack the exact ptrack.exe it carries
      # into its own LOCALAPPDATA folder and keep the desktop process running.
      - name: Smoke the single-file portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "0.22.0"
          $packages = Join-Path $env:RUNNER_TEMP "packages"
          $portable = Join-Path $packages "p-track_${version}_windows_${{ matrix.arch }}_portable.exe"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "portable-appdata-$([guid]::NewGuid())"
          $env:PTRACK_HOME = Join-Path $env:RUNNER_TEMP "portable-home-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA | Out-Null
          $root = Join-Path $env:LOCALAPPDATA 'p-track\portable'
          $process = $null
          $unpacked = @()
          try {
            $process = Start-Process -FilePath $portable -PassThru
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "single-file portable exited during startup smoke (code=$($process.ExitCode))"
            }
            $unpacked = @(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue)
            if ($unpacked.Count -ne 1 -or $unpacked[0].Name -ne 'ptrack.exe') {
              throw "single-file portable unpacked $($unpacked.Count) files under $root"
            }
            $digest = (Get-FileHash -LiteralPath $unpacked[0].FullName -Algorithm SHA256).Hash
            if ($digest -ne (Get-FileHash -LiteralPath target/release/ptrack.exe -Algorithm SHA256).Hash) {
              throw "single-file portable unpacked a different ptrack.exe"
            }
            if ($unpacked[0].Directory.Name -ne $digest.ToLowerInvariant()) {
              throw "single-file portable unpacked into $($unpacked[0].Directory.Name), not its digest"
            }
            $reported = & $unpacked[0].FullName version
            if ($reported -ne "ptrack $version") {
              throw "unpacked ptrack reports '$reported'"
            }
            $desktop = @(Get-Process -Name ptrack -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $unpacked[0].FullName })
            if ($desktop.Count -lt 1) {
              throw "single-file portable did not start the desktop process"
            }
          } finally {
            foreach ($copy in $unpacked) {
              Get-Process -Name ptrack -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $copy.FullName } | Stop-Process -Force
            }
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

  native-macos:
    name: native (${{ matrix.archive_os }}/${{ matrix.arch }})
    needs: portable
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'native-acceptance-approved')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            archive_os: darwin
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up native Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: "1.89.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # One cache family per OS, shared with the release workflow.
          shared-key: rust-${{ runner.os }}
          # PRs restore main caches without creating isolated duplicate copies.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify exact native host
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.rust_target }}"

      - name: Execute native Rust suites
        shell: bash
        run: |
          cargo test --all-targets --no-fail-fast \
            -p ptrack-app \
            -p ptrack-desktop \
            -p ptrack-store \
            -p ptrack-terminal \
            -p ptrack-updater

      - name: Build and smoke packaged macOS launcher
        shell: bash
        run: |
          version="0.22.0"
          export PTRACK_BUILD_VERSION="$version"
          npm --prefix frontend run tauri -- build \
            --target "${{ matrix.rust_target }}" --bundles app --no-sign --ci \
            --config "{\"version\":\"${version}\"}"
          app="target/${{ matrix.rust_target }}/release/bundle/macos/p-track.app"
          cp build/darwin/launcher "$app/Contents/MacOS/p-track"
          chmod +x "$app/Contents/MacOS/p-track"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable p-track" "$app/Contents/Info.plist"
          python3 tools/release_contract.py validate-binary \
            "$app/Contents/MacOS/ptrack" "$version" darwin "${{ matrix.arch }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "p-track"
          mkdir -p "$RUNNER_TEMP/ptrack-home"
          chmod 700 "$RUNNER_TEMP/ptrack-home"
          pid=""
          cleanup() {
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              wait "$pid" || true
            fi
          }
          trap cleanup EXIT
          PTRACK_HOME="$RUNNER_TEMP/ptrack-home" "$app/Contents/MacOS/p-track" &
          pid=$!
          sleep 8
          kill -0 "$pid"
