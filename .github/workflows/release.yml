name: release

# Publishes a GitHub release with cross-platform binaries. Triggered ONLY by
# pushing a version tag (vX.Y.Z) — never on push to a branch or on pull requests.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate stable release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must be canonical stable SemVer (vX.Y.Z)."
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Test Rust runtime and release producer
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --no-fail-fast
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          python3 -B -m unittest tools.release_contract_test

      - name: Set up retained legacy-exporter toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/ptrack-db-export/go.mod
          cache-dependency-path: tools/ptrack-db-export/go.sum

      - name: Test retained read-only legacy exporter
        shell: bash
        run: |
          (cd tools/ptrack-db-export && go test ./... && go vet ./... && go mod tidy)
          git diff --exit-code -- tools/ptrack-db-export/go.mod tools/ptrack-db-export/go.sum

  build:
    name: build (${{ matrix.archive_os }}/${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            archive_os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            archive_os: linux
            arch: arm64
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            archive_os: darwin
            arch: amd64
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            archive_os: darwin
            arch: arm64
          - runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            archive_os: windows
            arch: amd64
          - runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            archive_os: windows
            arch: arm64

    # Secrets cannot be referenced in step-level `if` conditions. Every macOS
    # package must have the complete signing and notarization trust chain.
    env:
      SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      NOTARY_ENABLED: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require updater-compatible macOS credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${SIGNING_ENABLED}" != "true" ] || [ "${NOTARY_ENABLED}" != "true" ]; then
            echo "::error::macOS releases require complete Developer ID and notarization credentials."
            exit 1
          fi

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          export PTRACK_BUILD_VERSION="${version}"
          npm --prefix frontend run tauri -- build \
            --target "${{ matrix.rust_target }}" --no-bundle --ci \
            --config "{\"version\":\"${version}\"}" -- --locked
          python3 tools/release_contract.py validate-binary \
            "target/${{ matrix.rust_target }}/release/ptrack" \
            "${version}" linux "${{ matrix.arch }}"

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $env:PTRACK_BUILD_VERSION = $version
          $config = "{`"version`":`"$version`"}"
          npm --prefix frontend run tauri -- build `
            --target "${{ matrix.rust_target }}" --no-bundle --ci `
            --config $config -- --locked
          python tools/release_contract.py validate-binary `
            "target/${{ matrix.rust_target }}/release/ptrack.exe" `
            $version windows "${{ matrix.arch }}"

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          export PTRACK_BUILD_VERSION="${version}"
          npm --prefix frontend run tauri -- build \
            --target "${{ matrix.rust_target }}" --bundles app --no-sign --ci \
            --config "{\"version\":\"${version}\"}" -- --locked
          app="target/${{ matrix.rust_target }}/release/bundle/macos/p-track.app"
          test -f "$app/Contents/MacOS/ptrack"
          python3 tools/release_contract.py validate-binary \
            "$app/Contents/MacOS/ptrack" "${version}" darwin "${{ matrix.arch }}"
          cp build/darwin/launcher "$app/Contents/MacOS/p-track"
          chmod +x "$app/Contents/MacOS/p-track"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable p-track" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${version}" "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "p-track"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${version}"

      - name: Import signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" \
            -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/codesign.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Sign macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app="target/${{ matrix.rust_target }}/release/bundle/macos/p-track.app"
          codesign --force --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
            "$app/Contents/MacOS/ptrack"
          codesign --force --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app/Contents/MacOS/ptrack" 2>&1 \
            | grep -E "^(Identifier|Authority|TeamIdentifier)"

      - name: Package Unix CLI archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="ptrack_${version}_${{ matrix.archive_os }}_${{ matrix.arch }}"
          mkdir -p "dist/${archive}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "target/${{ matrix.rust_target }}/release/bundle/macos/p-track.app/Contents/MacOS/ptrack" \
              "dist/${archive}/ptrack"
          else
            cp "target/${{ matrix.rust_target }}/release/ptrack" "dist/${archive}/ptrack"
          fi
          cp README.md LICENSE "dist/${archive}/"
          tar -C "dist/${archive}" -czf "dist/${archive}.tar.gz" .
          rm -rf "dist/${archive}"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="target/${{ matrix.rust_target }}/release/bundle/macos/p-track.app"
          mkdir -p build/dmg
          cp -R "$app" build/dmg/
          ln -s /Applications build/dmg/Applications
          dmg="dist/p-track_${version}_darwin_${{ matrix.arch }}.dmg"
          hdiutil create -volname "p-track" -srcfolder build/dmg -ov -format UDZO "$dmg"
          rm -rf build/dmg
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"

      - name: Notarize disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/p-track_${version}_darwin_${{ matrix.arch }}.dmg"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Verify macOS updater trust contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/p-track_${version}_darwin_${{ matrix.arch }}.dmg"
          requirement='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = "3CAJR4ZDMQ"'
          hdiutil verify "$dmg"
          codesign --verify --strict --verbose=2 -R="$requirement" "$dmg"
          spctl --assess --type open --context context:primary-signature "$dmg"

      - name: Package Windows CLI archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $archive = "ptrack_${version}_${{ matrix.archive_os }}_${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$archive"
          Copy-Item "target/${{ matrix.rust_target }}/release/ptrack.exe", README.md, LICENSE `
            -Destination "dist/$archive"
          Compress-Archive -Path "dist/$archive/*" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - name: Upload exact packaged assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.archive_os }}-${{ matrix.arch }}
          path: |
            dist/ptrack_*
            dist/p-track_*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packaged assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate packages and create checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/release_contract.py validate-dist dist "$version"
          python3 tools/release_contract.py checksums dist "$version"

      - name: Extract bounded release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 tools/release_contract.py release-notes \
            CHANGELOG.md "$version" release-notes.md

      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "p-track ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
