name: release

# Publishes a GitHub release with cross-platform binaries. Triggered ONLY by
# pushing a version tag (vX.Y.Z) — never on push to a branch or on pull requests.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux/amd64
            archive_os: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            target: linux/arm64
            archive_os: linux
            goarch: arm64
          - runner: macos-15-intel
            target: darwin/amd64
            archive_os: darwin
            goarch: amd64
          - runner: macos-15
            target: darwin/arm64
            archive_os: darwin
            goarch: arm64
          - runner: windows-2025
            target: windows/amd64
            archive_os: windows
            goarch: amd64
          - runner: windows-11-arm
            target: windows/arm64
            archive_os: windows
            goarch: arm64

    # Secrets cannot be referenced in step-level `if` conditions, so they are
    # resolved into job-level environment flags once. SIGNING_ENABLED turns on
    # Developer ID signing; NOTARY_ENABLED additionally staples Apple
    # notarization tickets once the App Store Connect API key secrets exist.
    env:
      SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      NOTARY_ENABLED: ${{ secrets.APPLE_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prebuild frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build \
            -clean \
            -nopackage \
            -trimpath \
            -platform "${{ matrix.target }}" \
            -tags webkit2_41 \
            -ldflags "-s -w -X github.com/ro-ag/ptrack/internal/cli.Version=${version}"

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build \
            -clean \
            -trimpath \
            -platform "${{ matrix.target }}" \
            -ldflags "-s -w -X github.com/ro-ag/ptrack/internal/cli.Version=${version}"
          # Install the launcher entry point (runs `ptrack gui`); the bundle's
          # CFBundleExecutable points at it, so the app cannot start without it.
          cp build/darwin/launcher "build/bin/p-track.app/Contents/MacOS/p-track"
          chmod +x "build/bin/p-track.app/Contents/MacOS/p-track"
          # Stamp the release version into the bundle metadata.
          app="build/bin/p-track.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${version}" "$app/Contents/Info.plist"

      - name: Import signing certificate
        if: runner.os == 'macOS' && env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Import the Developer ID identity into a throwaway keychain so the
          # runner's login keychain is never touched.
          keychain="$RUNNER_TEMP/codesign.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/codesign.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/codesign.p12" \
            -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          # Let codesign use the key without interactive prompts.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/codesign.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Sign app bundle
        if: runner.os == 'macOS' && env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app="build/bin/p-track.app"
          # The bundle's main executable is the launcher script, so the
          # notary checks the ptrack binary's own signature: sign the binary
          # first, then the bundle as a whole.
          codesign --force --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$app/Contents/MacOS/ptrack"
          codesign --force --options runtime \
            --entitlements build/darwin/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$app"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app/Contents/MacOS/ptrack" 2>&1 \
            | grep -E "^(Identifier|Authority|TeamIdentifier)"

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build `
            -clean `
            -nopackage `
            -trimpath `
            -windowsconsole `
            -platform "${{ matrix.target }}" `
            -ldflags "-s -w -X github.com/ro-ag/ptrack/internal/cli.Version=$version"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="ptrack_${version}_${{ matrix.archive_os }}_${{ matrix.goarch }}"
          mkdir -p "dist/${archive}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # The CLI binary ships inside the app bundle on macOS.
            cp "build/bin/p-track.app/Contents/MacOS/ptrack" "dist/${archive}/ptrack"
          else
            cp build/bin/ptrack "dist/${archive}/"
          fi
          cp README.md LICENSE "dist/${archive}/"
          archive_path="${PWD}/dist/${archive}.tar.gz"
          tar -C "dist/${archive}" -czf "${archive_path}" .
          rm -rf "dist/${archive}"

      - name: Package macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/dmg
          cp -R "build/bin/p-track.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "p-track" -srcfolder build/dmg \
            -ov -format UDZO "dist/p-track_${version}_darwin_${{ matrix.goarch }}.dmg"
          rm -rf build/dmg
          if [ "${SIGNING_ENABLED}" = "true" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp \
              "dist/p-track_${version}_darwin_${{ matrix.goarch }}.dmg"
          fi

      - name: Notarize disk image
        if: runner.os == 'macOS' && env.SIGNING_ENABLED == 'true' && env.NOTARY_ENABLED == 'true'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/p-track_${version}_darwin_${{ matrix.goarch }}.dmg"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $archive = "ptrack_${version}_${{ matrix.archive_os }}_${{ matrix.goarch }}"
          New-Item -ItemType Directory -Force -Path "dist/$archive"
          Copy-Item build/bin/ptrack.exe, README.md, LICENSE -Destination "dist/$archive"
          Compress-Archive -Path "dist/$archive/*" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.archive_os }}-${{ matrix.goarch }}
          path: |
            dist/ptrack_*
            dist/p-track_*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum ptrack_* p-track_* > checksums.txt

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "p-track ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
